<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة تحضير معهد أسس</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a single green header band, then one working column of cards; trainer view is a roll-call list, admin view is tabs. Single light theme by choice. */
:root{
  --green:#1F5136; --green-2:#2C6B4A; --gold:#C9A54C; --gold-pale:#FBF4E2;
  --ink:#1D2621; --muted:#5E6B64; --line:#DCE3DE; --bg:#F3F5F2; --card:#FFFFFF;
  --ok:#1E7B46; --ok-bg:#E3F3E8; --late:#9A6A00; --late-bg:#FFF2CC; --abs:#B3261E; --abs-bg:#FBE4E2; --exc:#2F5C9A; --exc-bg:#E2ECF8;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--green);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;flex:none}
.top h1{font-family:var(--display);font-size:19px;margin:0;font-weight:600;line-height:1.2}
.top .sub{font-size:12.5px;opacity:.8}
.top .spacer{flex:1}
.top .who{font-size:13px;display:flex;align-items:center;gap:8px}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px;color:var(--green);text-wrap:balance}
.card h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--green-2)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--green);font-weight:700}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.danger{color:var(--abs);border-color:#EBC3BF}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:160px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
textarea{min-height:110px;resize:vertical}
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.portal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:10px;cursor:pointer;text-align:right;border-top:5px solid var(--green)}
.portal.t{border-top-color:var(--gold)}
.portal:hover{box-shadow:0 6px 20px rgba(31,81,54,.12)}
.portal b{font-family:var(--display);font-size:21px;color:var(--green);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tab.on{background:var(--green);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.stat .l{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}
.item .t{font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted)}
.pill.f{background:#F6E7EF;color:#8A2D5C}.pill.m{background:#E4EEF7;color:#24507D}
.pill.p{background:var(--ok-bg);color:var(--ok)}.pill.l{background:var(--late-bg);color:var(--late)}.pill.a{background:var(--abs-bg);color:var(--abs)}.pill.e{background:var(--exc-bg);color:var(--exc)}
.pill.warn{background:var(--abs-bg);color:var(--abs)}
.groupcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;display:grid;gap:4px;text-align:right;border-inline-start:5px solid var(--green)}
.groupcard:hover{border-color:var(--green-2)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.stu{display:grid;grid-template-columns:28px 1fr;gap:6px 10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stu.p{border-inline-start:5px solid var(--ok)}.stu.l{border-inline-start:5px solid #D9A400}.stu.a{border-inline-start:5px solid var(--abs)}.stu.e{border-inline-start:5px solid var(--exc)}
.stu .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.stu .nm{font-weight:600}
.stu .ctl{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on.p{background:var(--ok);color:#fff}.seg button.on.l{background:#D9A400;color:#fff}.seg button.on.a{background:var(--abs);color:#fff}.seg button.on.e{background:var(--exc);color:#fff}
.times{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.times input{width:118px;padding:6px 8px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--green);color:#fff;font-weight:600;position:sticky;top:0}
td.nm,th.nm{text-align:right}
tr:nth-child(even) td{background:#FAFBFA}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green-2)}
.notice{background:var(--gold-pale);border:1px solid #EAD9A8;border-radius:12px;padding:12px 14px;font-size:14px}
.notice.err{background:var(--abs-bg);border-color:#EBC3BF;color:#7A1B15}
.code{font-family:ui-monospace,Menlo,monospace;font-size:16px;letter-spacing:2px;background:var(--gold-pale);padding:3px 10px;border-radius:8px;color:var(--green);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(18,30,24,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px;background:#fff}
.chip button{border:0;background:var(--bg);width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--abs);font-weight:700;line-height:1}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
.toast.on{display:block}
.empty{padding:22px;text-align:center;color:var(--muted)}
@media (max-width:520px){.top h1{font-size:17px}.times input{width:104px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark" aria-hidden="true">أ</div>
  <div>
    <h1>معهد أسس التقنية والقانون</h1>
    <div class="sub" id="topSub">بوابة الحضور والانصراف</div>
  </div>
  <div class="spacer"></div>
  <div class="who" id="topWho"></div>
</header>
<main class="wrap" id="app">
  <div class="card"><p class="muted" style="margin:0">جاري التحميل…</p></div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="./app.js?v=3"></script>
</body>
</html>
